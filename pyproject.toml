[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "double-negative-speech"
version = "1.3.0"
description = "Rule-based generator/decoder for Chinese double negation and hedging constructions, with a fixed JSON contract and a three-tier certainty."
readme = "README.en.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
keywords = ["chinese", "negation", "double-negative", "nlp", "agent-skill", "explainable"]
dependencies = []

[project.urls]
Homepage = "https://github.com/getouxx/double-negative-speech"
Mirror = "https://gitee.com/Qeaget/double-negative-speech"

[project.scripts]
wanhua = "wanhua:main"
negation-count = "negation_count:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["wanhua", "negation_count", "evaluate"]
